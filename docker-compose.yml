version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: whatsapp_bot_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: whatsapp_bot
    ports:
      - "3306:3306"
    volumes:
      - ./whatsapp-bot/db-init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  bot:
    build: ./whatsapp-bot
    container_name: whatsapp_bot_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: whatsapp_bot
    ports:
      - "3000:3000"
    volumes:
      - ./whatsapp-bot/sessions:/app/sessions
    depends_on:
      - db

volumes:
  db_data:
